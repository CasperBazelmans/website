<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon</title>
  <meta name="description" content="This website is under construction.">
  <style>
    :root {
      --bg: #f7f7f5;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2f6fed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #f2f2f2;
        --muted: #a0a0a0;
        --accent: #7aa2ff;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 520px; }
    .dot {
      width: 12px;
      height: 12px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; letter-spacing: -0.02em; }
    p { margin-top: 12px; font-size: 1.1rem; color: var(--muted); line-height: 1.5; }
    footer { margin-top: 48px; font-size: 0.85rem; color: var(--muted); }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
    }
  </style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>Coming soon</h1>
    <p>This website is under construction. Check back soon!</p>
    <footer>&copy; <span id="year">2026</span></footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
